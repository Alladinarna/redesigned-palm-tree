# /etc/rsyslog.d/90-logg.conf – elev-46
# Skickar urvalet från workshop 1 till loggservern över TLS (RFC 5425).
# Flödestabellen: F11, elev-46 → log 172.20.1.58, TCP 6514.
# Urval: allt på nivå info eller allvarligare utom mail. Omfattar
# autentisering (authpriv), brandvägg (kern), cron, system, testhändelser (user)
# och granskningsloggen (auditd via audisp-syslog, user.info).

# Vilken utfärdare elev-46 litar på: labbets CA
global(DefaultNetstreamDriverCAFile="/etc/pki/rsyslog/ca.pem")

*.info;mail.none action(type="omfwd" target="172.20.1.58" port="6514" protocol="tcp" Template="RSYSLOG_SyslogRFC5424For>
        StreamDriver="gtls" StreamDriverMode="1" StreamDriverAuthMode="x509/name"
        StreamDriverPermittedPeers="log.sec.chas-lab.dev"
        queue.type="LinkedList" queue.filename="fwd_tls"
        queue.saveOnShutdown="on" action.resumeRetryCount="-1")
