# /etc/rsyslog.d/90-logg.conf – vecka 5: loggarna till loggservern log över TLS.
# Flöde D5 (F11–F13, F25) i flödestabellen. Ersätter 60-brandvagg.conf (klartext på tcp/514 i vecka 4).
# Bygger på kursens referens för elev-00 (vecka 5, föreläsning 6). Kontrollera med: sudo rsyslogd -N1
#
# Urval (se ../urval.md): allt från info och uppåt utom mail och cron. Det ger
#   authpriv  – sshd och sudo (det som hamnar i /var/log/secure)
#   kern      – paketfiltrets loggrader ZON-IN-DROP / ZON-UT-DROP (nftables loggar på nivå info)
#   user      – auditd:s syslog-plugin (audisp-syslog, args = LOG_INFO) och testhändelser från logger
#   daemon m.fl. – systemloggen (chronyd, systemd, rsyslog)
#
# TLS: servern kontrollerar loggserverns certifikat mot kursens CA (x509/name, namnet log.sec.chas-lab.dev).
# Loggservern identifierar oss på adressen (RFC 5425 §5.3). Varningarna "certificate file is not set"
# och "key file is not set" i rsyslogs logg är väntade – servern har inget eget certifikat.
#
# Mall: RSYSLOG_SyslogProtocol23Format = RFC 5424 med fullständig tidsstämpel (delsekunder och tidszon).
#
# Kö: diskstödd (queue.filename finns), sparas vid avstängning och försöker igen i all oändlighet.
# Köfilerna ligger i /var/lib/rsyslog (workDirectory i rsyslog.conf). Taket är 256 MB på disk.

global(DefaultNetstreamDriverCAFile="/etc/pki/rsyslog/ca.pem")

*.info;mail.none;cron.none action(type="omfwd" target="172.20.1.58" port="6514" protocol="tcp"
              template="RSYSLOG_SyslogProtocol23Format"
              StreamDriver="gtls" StreamDriverMode="1" StreamDriverAuthMode="x509/name"
              StreamDriverPermittedPeers="log.sec.chas-lab.dev"
              queue.type="LinkedList" queue.filename="fwd_logg"
              queue.saveOnShutdown="on" queue.maxDiskSpace="256m"
              action.resumeRetryCount="-1")
