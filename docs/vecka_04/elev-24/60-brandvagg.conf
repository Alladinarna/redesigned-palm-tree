# /etc/rsyslog.d/60-brandvagg.conf – skickar kärnloggen (ZON-IN-DROP, ZON-UT-DROP) till loggservern.
# Flöde D5. Klartext på tcp/514 i vecka 4, byts mot TLS på tcp/6514 i vecka 5.
kern.* action(type="omfwd" target="172.20.1.58" port="514" protocol="tcp"
              queue.type="LinkedList" queue.filename="fwd_kern"
              queue.saveOnShutdown="on" action.resumeRetryCount="-1")
